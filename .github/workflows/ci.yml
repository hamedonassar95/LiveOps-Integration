name: LiveOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (MIT, Node.js 24)
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (MIT)
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test metadata bridge
        run: python3 -m unittest discover -s tests -v

      - name: Type-check
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Send main build metadata to Devobs (optional)
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DEVOBS_DISPATCH_TOKEN: ${{ secrets.DEVOBS_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_WORKFLOW: ${{ github.workflow }}
          SOURCE_CONCLUSION: ${{ job.status }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: python3 scripts/send_devobs_dispatch.py
